  "components": {
    "securitySchemes": {
      "bearerAuth": {
        "type": "http",
        "scheme": "bearer",
        "bearerFormat": "JWT"
      }
    },
    "responses": {
      "BadRequest": {
        "description": "Invalid request",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/ErrorResponse"
            }
          }
        }
      },
      "Unauthorized": {
        "description": "Missing, invalid, expired, rotated, or logged-out authentication",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/ErrorResponse"
            }
          }
        }
      },
      "Forbidden": {
        "description": "Authenticated account lacks role, state, or ownership",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/ErrorResponse"
            }
          }
        }
      },
      "NotFound": {
        "description": "Resource not found",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/ErrorResponse"
            }
          }
        }
      },
      "Conflict": {
        "description": "Uniqueness, concurrency, stock, or state-transition conflict",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/ErrorResponse"
            }
          }
        }
      },
      "PayloadTooLarge": {
        "description": "Image exceeds 5 MB",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/ErrorResponse"
            }
          }
        }
      },
      "ServerError": {
        "description": "Unexpected server error",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/ErrorResponse"
            }
          }
        }
      }
    },
    "schemas": {
      "ErrorResponse": {
        "type": "object",
        "properties": {
          "success": {
            "type": "boolean",
            "const": false
          },
          "message": {
            "type": "string"
          },
          "errors": {
            "type": "array",
            "items": {}
          },
          "code": {
            "type": "string"
          }
        },
        "required": [
          "message"
        ]
      },
      "SuccessResponse": {
        "type": "object",
        "additionalProperties": true,
        "properties": {
          "success": {
            "type": "boolean"
          },
          "message": {
            "type": "string"
          },
          "data": {},
          "pagination": {
            "$ref": "#/components/schemas/Pagination"
          }
        }
      },
      "Pagination": {
        "type": "object",
        "properties": {
          "page": {
            "type": "integer"
          },
          "limit": {
            "type": "integer"
          },
          "total": {
            "type": "integer"
          },
          "totalItems": {
            "type": "integer"
          },
          "totalPages": {
            "type": "integer"
          }
        }
      },
      "GenericBody": {
        "type": "object",
        "additionalProperties": true
      },
      "Registration": {
        "type": "object",
        "required": [
          "Email",
          "Password"
        ],
        "properties": {
          "Email": {
            "type": "string",
            "format": "email"
          },
          "Password": {
            "type": "string",
            "format": "password"
          },
          "referralCode": {
            "type": "string"
          }
        }
      },
      "Login": {
        "type": "object",
        "required": [
          "Email",
          "Password"
        ],
        "properties": {
          "Email": {
            "type": "string",
            "format": "email"
          },
          "Password": {
            "type": "string",
            "format": "password"
          }
        }
      },
      "Email": {
        "type": "object",
        "required": [
          "email"
        ],
        "properties": {
          "email": {
            "type": "string",
            "format": "email"
          }
        }
      },
      "ResetPassword": {
        "type": "object",
        "required": [
          "resetToken",
          "password"
        ],
        "properties": {
          "resetToken": {
            "type": "string"
          },
          "password": {
            "type": "string",
            "format": "password"
          }
        }
      },
      "RefreshToken": {
        "type": "object",
        "required": [
          "refreshToken"
        ],
        "properties": {
          "refreshToken": {
            "type": "string"
          }
        }
      },
      "CartItem": {
        "type": "object",
        "properties": {
          "cartItemId": {
            "type": "string"
          },
          "productId": {
            "type": "string"
          },
          "quantity": {
            "type": "integer",
            "minimum": 1
          },
          "selectedVariants": {
            "type": "object",
            "additionalProperties": {
              "type": "string"
            }
          }
        }
      },
      "CartBulk": {
        "type": "object",
        "required": [
          "items"
        ],
        "properties": {
          "items": {
            "type": "array",
            "minItems": 1,
            "items": {
              "$ref": "#/components/schemas/CartItem"
            }
          }
        }
      },
      "ShippingAddress": {
        "type": "object",
        "required": [
          "fullName",
          "phone",
          "address",
          "city",
          "state",
          "pincode"
        ],
        "properties": {
          "fullName": {
            "type": "string"
          },
          "phone": {
            "type": "string",
            "pattern": "^[6-9][0-9]{9}$"
          },
          "address": {
            "type": "string"
          },
          "city": {
            "type": "string"
          },
          "state": {
            "type": "string"
          },
          "pincode": {
            "type": "string",
            "pattern": "^[1-9][0-9]{5}$"
          },
          "country": {
            "type": "string",
            "default": "India"
          }
        }
      },
      "Order": {
        "type": "object",
        "required": [
          "items",
          "shippingAddress"
        ],
        "properties": {
          "items": {
            "type": "array",
            "minItems": 1,
            "items": {
              "$ref": "#/components/schemas/CartItem"
            }
          },
          "shippingAddress": {
            "$ref": "#/components/schemas/ShippingAddress"
          },
          "paymentMethod": {
            "type": "string",
            "enum": [
              "COD",
              "cod",
              "UPI",
              "upi",
              "CARD",
              "card"
            ]
          },
          "coupon": {
            "type": [
              "string",
              "null"
            ]
          }
        }
      },
      "PaymentIntent": {
        "allOf": [
          {
            "$ref": "#/components/schemas/Order"
          },
          {
            "type": "object",
            "required": [
              "idempotencyKey"
            ],
            "properties": {
              "idempotencyKey": {
                "type": "string",
                "minLength": 16,
                "maxLength": 100
              },
              "useWallet": {
                "type": "boolean"
              }
            }
          }
        ]
      },
      "PaymentVerify": {
        "type": "object",
        "required": [
          "razorpay_order_id",
          "razorpay_payment_id",
          "razorpay_signature"
        ],
        "properties": {
          "orderId": {
            "type": "string"
          },
          "razorpay_order_id": {
            "type": "string"
          },
          "razorpay_payment_id": {
            "type": "string"
          },
          "razorpay_signature": {
            "type": "string"
          }
        }
      },
      "CouponApply": {
        "type": "object",
        "required": [
          "couponId",
          "items"
        ],
        "properties": {
          "couponId": {
            "type": "string"
          },
          "items": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/CartItem"
            }
          }
        }
      },
      "Review": {
        "type": "object",
        "required": [
          "rating",
          "comment"
        ],
        "properties": {
          "rating": {
            "type": "integer",
            "minimum": 1,
            "maximum": 5
          },
          "comment": {
            "type": "string",
            "minLength": 3,
            "maxLength": 1000
          }
        }
      }
    }
  }
}
